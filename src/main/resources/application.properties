spring.application.name=student_management

# ==============================
# PostgreSQL / Supabase Configuration
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres.uqinsnnnzicqvetczbnr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:9izqMBwCdiEBGCCd}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (tuned for Supabase connection limits)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==============================
# Server Configuration
# ==============================
# Render dynamically passes PORT; defaults to 8080 locally
server.port=${PORT:8080}